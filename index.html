<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevBoard — tableros Kanban para organizar tareas" />
    <title>DevBoard</title>
    <script>
      // Aplica el tema guardado ANTES del render para evitar el parpadeo (FOUC).
      // (docs/SPEC.md §10 — script obligatorio)
      (function () {
        try {
          var saved = localStorage.getItem('devboard-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
